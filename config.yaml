# config.yaml — Voice Assistant Python Hub Configuration

server:
  host: "0.0.0.0"
  port: 8765
  http_port: 8766
  keepalive_timeout: 30  # 秒，无数据超时后关闭连接

prompt_dir: "./prompts"

llm:
  base_url: "http://vllm-server:8000/v1"
  model: "cyankiwi/gemma-4-E4B-it-AWQ-INT8"
  max_tokens: 131072
  temperature: 0.7

# Online LLM config (DeepSeek, OpenAI, etc.)
online_llm:
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-v4-flash"
  api_key: ""  # set via DEEPSEEK_API_KEY env var
  max_tokens: 8192
  temperature: 0.7

# Active LLM for chat: "local" or "online"
active_chat_llm: "local"

asr:
  base_url: "http://asr-server:8000/v1"
  model: "Qwen/Qwen3-ASR-0.6B"
  sample_rate: 16000

tts:
  provider: "edge"  # "edge" or "qwen"

  # Edge TTS settings
  voice: "zh-CN-XiaoxiaoNeural"
  rate: "-20%"
  pitch: "+13Hz"
  volume: "+0%"

  # Qwen3-TTS settings (via vLLM-Omni)
  qwen_api_base: "http://qwen-tts-vllm:8000/v1"
  qwen_model: "Qwen3-TTS-12Hz-0.6B-CustomVoice"
  qwen_voice: "Awesome_Sally"
  qwen_sample_rate: 24000

memory:
  # Rolling summary memory configuration (dual-track architecture)
  # Track 1: Main chat uses build_prompt() with global_summary + recent_turns
  # Track 2: Background async summarization via asyncio.create_task

  # Window parameters (sliding memory)
  window_size: 10           # N - max turns kept in short-term memory (recent_turns)
  step_size: 5              # M - turns to compress per summary (N/2, half-life strategy)

  # Trigger parameters (dual-gate)
  token_threshold: 8000    # chars, trigger summary if estimated tokens exceed this
  max_summary_length: 300  # max chars for global_summary (conservative ~300 tokens)


  # Session persistence (for debugging/sessions)
  session_dir: "./memory/sessions"
  summary_dir: "./memory/summaries"


  # Global memory (cross-session context with BM25 retrieval)
  global_dir: "./memory/global"
  global_top_k: 3          # max files to retrieve per query
  global_max_chars: 2000   # soft cap before Map-Reduce truncation

backpressure:
  asr_queue_max: 100      # ASR 输入队列最大长度
  tts_queue_max: 50       # TTS 音频队列最大长度
  llm_queue_max: 20       # LLM token 队列最大长度