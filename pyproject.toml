[project]
name = "python-hub"
version = "0.1.0"
description = "流式语音助手 Python Hub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "sherpa-onnx>=1.0",
    "openai>=1.0",
    "pyyaml>=6.0",
    "aiofiles>=0.8",
    "aiohttp>=3.9.0",
    "edge-tts>=0.2.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "pydantic>=2.0",
    "emoji>=2.0",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
